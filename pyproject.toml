[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-diagnostic-ai"
version = "0.1.0"
description = "Majster-AI (CDA) - an automotive UDS/CAN diagnostic agent bridging LLMs to vehicle modules, workshop manuals and the web via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["automotive", "uds", "can-bus", "obd2", "diagnostics", "mcp", "langgraph", "llm", "freelander"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Embedded Systems",
]

# Always required: configuration, validation and secrets handling.
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Talking to the vehicle. Needed for every backend except `virtual`.
car = [
    "python-can>=4.3",
    "udsoncan>=1.21",
    "can-isotp>=2.0",
    "pyserial>=3.5",
]

# The MCP servers themselves (stdio transport, FastMCP).
mcp = [
    "mcp>=1.2",
]

# The LangGraph orchestrator and its LLM providers.
agent = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.20",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "langchain-mcp-adapters>=0.1",
]

# Workshop-manual RAG. `sentence-transformers` is optional at runtime: without
# it the store falls back to a deterministic hash embedder (see rag_workshop).
rag = [
    "chromadb>=0.5",
    "pypdf>=4.0",
    "langchain-text-splitters>=0.3",
]
rag-local-embeddings = [
    "sentence-transformers>=3.0",
]

# Live web search. Tavily preferred, DuckDuckGo keyless fallback.
web = [
    "tavily-python>=0.5",
    "ddgs>=6.0",
]

# The HTTP/WebSocket server behind the Cyber-HUD frontend.
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "black>=24.3",
    "flake8>=7.0",
    "httpx>=0.27",
]

# Everything except the heavy local-embedding model.
all = [
    "car-diagnostic-ai[car,mcp,agent,rag,web,ui]",
]

[project.scripts]
# All three names launch the same CLI -- Car_Diagnostic_AI / CDA / Majster-AI.
majster-ai = "majster_ai.cli:main"
cda = "majster_ai.cli:main"
car-diagnostic-ai = "majster_ai.cli:main"

[project.urls]
Repository = "https://github.com/Mati83mon/Car_Diagnostic_Ai"

[tool.setuptools.packages.find]
include = ["majster_ai*"]

[tool.setuptools.package-data]
"majster_ai.mcp_servers.car_interface" = ["data/*.json"]

[tool.black]
line-length = 100
# Pinned to the minimum supported Python: black formats for the highest target
# in the list, and that output cannot be re-parsed by older interpreters, which
# breaks `black --check` on a 3.10/3.11 CI runner.
target-version = ["py310"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Lets `pytest` work from a fresh checkout before `pip install -e .`
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "hardware: requires a physical vehicle interface; deselected by default and never run in CI",
    "slow: noticeably slow (model downloads, large ingests)",
    "integration: exercises several components together",
]
filterwarnings = [
    "error::DeprecationWarning:majster_ai.*",
    # starlette's TestClient warns about httpx vs httpx2; it is their internal
    # choice, not ours, and switching stacks to silence it is not worth it.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["majster_ai"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
